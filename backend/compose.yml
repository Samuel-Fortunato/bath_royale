# Minimal subset of supabase/supabase self-hosted/v0.8.5; amd64 digests.
name: ${POC_PROJECT:-bath-royale-poc}
services:
  db:
    container_name: ${POC_PROJECT:-bath-royale-poc}-db
    # supabase/postgres:17.6.1.136
    image: docker.io/supabase/postgres@sha256:5a4314708484bec672de2c09653a5c01fb1c84a998564ac231b0325e2238ed5b
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 2s
      timeout: 5s
      retries: 60
    # No host database listener; psql runs with podman exec.
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=fatal, -c, log_statement=none, -c, log_min_error_statement=panic]
  auth:
    container_name: ${POC_PROJECT:-bath-royale-poc}-auth
    # supabase/gotrue:v2.198.0
    image: docker.io/supabase/gotrue@sha256:5e9ee59d7406d21412b35e6b524a1f2004ff518a0b49fa3cc08dee75811af09d
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:${AUTH_PORT:-55431}:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${AUTH_PORT:-55431}
      GOTRUE_SITE_URL: http://127.0.0.1:${AUTH_PORT:-55431}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 60
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # Auto-confirm fictional accounts; SMTP deliberately points to a closed local port.
      GOTRUE_SMTP_HOST: 127.0.0.1
      GOTRUE_SMTP_PORT: 1
      GOTRUE_SMTP_ADMIN_EMAIL: nobody@example.invalid
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_RATE_LIMIT_SIGN_UPS: 100
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 300
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_LOG_LEVEL: error
  rest:
    container_name: ${POC_PROJECT:-bath-royale-poc}-rest
    # postgrest/postgrest:v14.18
    image: docker.io/postgrest/postgrest@sha256:c7cd7e265a85b05248abf53f4473fcec7e327c282d0bd0cf60f1551996d09fcf
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:${REST_PORT:-55432}:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:${REST_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000
      PGRST_LOG_LEVEL: crit
volumes:
  db-data:
    name: ${POC_PROJECT:-bath-royale-poc}-db-data
  db-config:
    name: ${POC_PROJECT:-bath-royale-poc}-db-config
networks:
  default:
    name: ${POC_PROJECT:-bath-royale-poc}-network
    internal: true
