name: Backend administration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - name: Prepare disposable rootless container tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman uidmap
          # Disposable hosted runner only; never configure the owner's host.
          for mapping in subuid subgid; do
            if awk -F: -v account="$(id -un)" '$1 == account { found=1 } END { exit !found }' "/etc/$mapping"; then
              continue
            fi
            range_start=$(awk -F: 'BEGIN { end=100000 } $2+$3>end { end=$2+$3 } END { print end }' "/etc/$mapping")
            if [ "$mapping" = subuid ]; then option=--add-subuids; else option=--add-subgids; fi
            sudo usermod "$option" "$range_start-$((range_start+65535))" "$(id -un)"
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify rootless runtime before creating any bootstrap secret
        run: |
          nix develop .#backend --no-write-lock-file --command podman info --format '{{.Host.Security.Rootless}}'
          nix develop .#backend --no-write-lock-file --command podman run --rm --network none --entrypoint /bin/true docker.io/supabase/postgres@sha256:5a4314708484bec672de2c09653a5c01fb1c84a998564ac231b0325e2238ed5b
      - name: Lint and test application-owned administration
        run: |
          nix develop .#backend --no-write-lock-file --command ruff check backend
          nix develop .#backend --no-write-lock-file --command ruff format --check backend
          nix develop .#backend --no-write-lock-file --command env PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - name: Exercise mutations only in a new isolated database
        run: nix develop .#backend --no-write-lock-file --command python backend/administration_rehearsal.py
