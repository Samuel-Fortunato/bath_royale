name: Android preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every successful build gets its own publication; newer pushes cannot cancel it.
concurrency:
  group: android-preview-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    defaults:
      run:
        shell: nix develop --no-write-lock-file --command bash --noprofile --norc -e -o pipefail {0}
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      configured_alpha: ${{ steps.build.outputs.configured_alpha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache downloaded dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pub-cache
            .gradle/caches
            .gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('flake.lock', 'pubspec.lock', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-${{ runner.os }}-
      - name: Resolve locked packages and show toolchain
        run: |
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-preview-signing" >> "$GITHUB_ENV"
          flutter --version
          java -version
          flutter pub get --enforce-lockfile
      - name: Check formatting
        run: |
          actionlint
          python3 -m unittest discover -s tool -p "test_*.py"
          dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze (only documented Material import debt is accepted)
        run: dart run tool/check_analysis.dart
      - name: Test
        run: flutter test --no-pub
      - name: Set preview version
        id: version
        run: |
          build_number=$((1000 + GITHUB_RUN_NUMBER))
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
      - name: Restore the existing preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ]; then
            echo '::error::Configure ANDROID_PREVIEW_KEYSTORE_BASE64; refusing an incompatible temporary signing key.'
            exit 1
          fi
          umask 077
          mkdir -p "$ANDROID_USER_HOME"
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
          echo "PREVIEW_KEYSTORE=$ANDROID_USER_HOME/debug.keystore" >> "$GITHUB_ENV"
          python3 tool/verify_preview.py key "$ANDROID_USER_HOME/debug.keystore"
      - name: Build installable APK (configured alpha requires owner gate)
        id: build
        env:
          ALPHA_RELEASE_APPROVED: ${{ vars.ALPHA_RELEASE_APPROVED }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ "$ALPHA_RELEASE_APPROVED" = true ]; then
            python3 tool/build_alpha.py --number "$PREVIEW_BUILD_NUMBER"
            echo "configured_alpha=true" >> "$GITHUB_OUTPUT"
            echo "APK_VERSION_NAME=0.1.0-alpha.$PREVIEW_BUILD_NUMBER" >> "$GITHUB_ENV"
          else
            flutter build apk --release --no-pub --build-name "0.1.0-preview.${GITHUB_RUN_NUMBER}" --build-number "$PREVIEW_BUILD_NUMBER"
            echo "APK_VERSION_NAME=0.1.0-preview.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Verify identity, version and signing certificate
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          python3 tool/verify_preview.py apk "$apk" "$PREVIEW_BUILD_NUMBER" "$APK_VERSION_NAME"
          mkdir -p preview
          cp "$apk" preview/bath-royale.apk
          (cd preview && sha256sum ./*.apk > SHA256SUMS)
          {
            echo "### Android preview $PREVIEW_BUILD_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo 'Download bath-royale.apk from the repository Releases page.'
            echo 'Install as an update; do not uninstall the existing app.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bath-royale-preview-${{ steps.version.outputs.build_number }}
          path: preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-preview-signing/debug.keystore"

  prerelease:
    if: github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bath-royale-preview-${{ needs.verify-and-build.outputs.build_number }}
          path: preview
      - name: Publish verified download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ needs.verify-and-build.outputs.build_number }}
          CONFIGURED_ALPHA: ${{ needs.verify-and-build.outputs.configured_alpha }}
        run: python3 tool/publish_preview.py
