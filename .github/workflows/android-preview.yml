name: Android preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A7.4 validation-only: publication is an exact-commit manager operation.
concurrency:
  group: android-preview-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    defaults:
      run:
        shell: nix develop --no-write-lock-file --command bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache downloaded dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pub-cache
            .gradle/caches
            .gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('flake.lock', 'pubspec.lock', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-${{ runner.os }}-
      - name: Resolve locked packages and show toolchain
        run: |
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-preview-signing" >> "$GITHUB_ENV"
          flutter --version
          java -version
          flutter pub get --enforce-lockfile
      - name: Check formatting
        run: |
          actionlint
          python3 -m unittest discover -s tool -p "test_*.py"
          dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze (only documented Material import debt is accepted)
        run: dart run tool/check_analysis.dart
      - name: Test
        run: flutter test --no-pub
      - name: Set preview version
        id: version
        run: |
          echo "PREVIEW_BUILD_NUMBER=1" >> "$GITHUB_ENV"
          echo "BATH_BUILD_CHANNEL=development" >> "$GITHUB_ENV"
          name=$(python3 tool/app_version.py | python3 -c 'import json,sys; print(json.load(sys.stdin)["version_name"])')
          echo "APK_VERSION_NAME=$name" >> "$GITHUB_ENV"
      - name: Restore the existing preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_BASE64" ]; then
            echo '::error::Configure ANDROID_PREVIEW_KEYSTORE_BASE64; refusing an incompatible temporary signing key.'
            exit 1
          fi
          umask 077
          mkdir -p "$ANDROID_USER_HOME"
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
          echo "PREVIEW_KEYSTORE=$ANDROID_USER_HOME/debug.keystore" >> "$GITHUB_ENV"
          python3 tool/verify_preview.py key "$ANDROID_USER_HOME/debug.keystore"
      - name: Build isolated validation APK
        run: |
          flutter build apk --release --no-pub --build-name "$APK_VERSION_NAME" --build-number "$PREVIEW_BUILD_NUMBER" --dart-define="BATH_APP_VERSION=$APK_VERSION_NAME"
      - name: Verify identity, version and signing certificate
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          python3 tool/verify_preview.py apk "$apk" "$PREVIEW_BUILD_NUMBER" "$APK_VERSION_NAME" com.example.bath_royale.development
          echo 'Isolated validation passed. No distributable asset or publication.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-preview-signing/debug.keystore"
